<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa valori Lodi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .legenda { background: #fff; padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .legenda i { display: inline-block; width: 22px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 6px; }
  .legenda .sw { display: inline-block; width: 22px; height: 12px; vertical-align: middle; margin-right: 6px; border: 1px solid #888; }
  .legenda small { color: #666; }
  .pop { max-width: 340px; font-size: 13px; line-height: 1.4; }
  .pop h3 { margin: 0 0 4px; font-size: 15px; }
  .pop .kpi { margin: 6px 0; }
  .pop .kpi b { font-size: 16px; }
  .pop ul { margin: 2px 0 6px; padding-left: 18px; }
  .pop .pro { color: #1a7f37; } .pop .contro { color: #b3261e; }
  .pop .fonte { color: #666; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/base.js"></script>
<script>
const map = L.map('map').setView([45.314, 9.503], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// --- Macrozone: colore per €/mq richiesto ---
// Scala di Immobiliare.it (legenda della sua mappa prezzi, 11 classi): < 1.800, poi classi da 100 €/mq fino a >= 2.700
const SCALA = ['rgb(32,157,76)', 'rgb(67,161,63)', 'rgb(107,166,47)', 'rgb(148,172,31)', 'rgb(187,177,16)', 'rgb(228,181,0)',
               'rgb(221,152,12)', 'rgb(214,121,25)', 'rgb(207,92,36)', 'rgb(200,61,49)', 'rgb(194,33,60)'];
const classe = v => v < 1800 ? 0 : v >= 2700 ? 10 : Math.floor((v - 1800) / 100) + 1;
const colore = v => SCALA[classe(v)];
const eur = n => n.toLocaleString('it-IT');
const lista = a => '<ul>' + a.map(x => `<li>${x}</li>`).join('') + '</ul>';

Promise.all(['data/zone.json', 'data/zone-poly.json', 'data/vie.json'].map(u => fetch(u).then(r => r.json()))).then(([zone, poligoni, vie]) => {
  const prezzi = zone.map(z => z.ask), min = Math.min(...prezzi), max = Math.max(...prezzi);
  const gruppo = L.layerGroup().addTo(map);
  zone.forEach(z => {
    const pezzi = poligoni.features.filter(f => f.properties.k === z.k);
    if (!pezzi.length) return;
    const col = colore(z.ask);
    L.geoJSON({ type: 'FeatureCollection', features: pezzi }, { style: { color: '#fff', weight: 2, fillColor: col, fillOpacity: .6 } })
      .addTo(gruppo)
      .bindTooltip(`${z.k}: ${eur(z.ask)} €/mq`, { sticky: true })
      .bindPopup(`<div class="pop"><h3>${z.k}</h3>
        <div>${z.pos}</div>
        <div class="kpi"><b>${eur(z.ask)} €/mq</b> richiesto · trend 12 mesi <b>${z.yoy > 0 ? '+' : ''}${String(z.yoy).replace('.', ',')}%</b><br>
        ${z.n} annunci · affitto ${String(z.rent).replace('.', ',')} €/mq/mese</div>
        <b class="pro">Pro</b>${lista(z.pro)}<b class="contro">Contro</b>${lista(z.contro)}
        <div><b>Giudizio flipping: ${z.score}.</b> ${z.flip}</div>
        <div style="margin-top:4px"><b>Microzone:</b> ${z.micro}</div>
        <div class="fonte">Fonte: Immobiliare.it, mercato immobiliare Lodi, settembre 2026 (prezzi richiesti, non compravendite). Confini zona: ricalcati dalla mappa zone di Immobiliare.it dove disponibile, altrove ricostruiti dalle vie di Immobiliare.it. Provvisori, da validare.</div></div>`, { maxWidth: 360 });
  });

  // --- Vie: colore per €/mq richiesto; contorno nero = sopra la mediana delle vie della sua zona ("via calda") ---
  const perZona = {};
  vie.forEach(v => (perZona[v.z] = perZona[v.z] || []).push(v.p));
  const mediana = a => { const s = a.slice().sort((x, y) => x - y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
  const med = {}; for (const z in perZona) med[z] = mediana(perZona[z]);
  const gVie = L.layerGroup().addTo(map);
  let nCalde = 0;
  vie.slice().sort((a, b) => a.p - b.p).forEach(v => {
    if (!v.g || !v.g.length) return;
    const calda = v.p > med[v.z], diff = (v.p / med[v.z] - 1) * 100;
    if (calda) { nCalde++; L.polyline(v.g, { color: '#000', weight: 9, opacity: .85, interactive: false }).addTo(gVie); }
    L.polyline(v.g, { color: colore(v.p), weight: calda ? 6 : 4, opacity: 1 }).addTo(gVie)
      .bindTooltip(`${v.n}: ${eur(v.p)} €/mq${calda ? ' ▲' : ''}`, { sticky: true })
      .bindPopup(`<div class="pop"><h3>${v.n}</h3>${v.z}
        <div class="kpi"><b>${eur(v.p)} €/mq</b> richiesto${v.r ? ` · affitto ${String(v.r).replace('.', ',')} €/mq/mese` : ''}<br>
        Mediana delle vie della zona: ${eur(Math.round(med[v.z]))} €/mq (${diff >= 0 ? '+' : ''}${diff.toFixed(1).replace('.', ',')}%)</div>
        ${calda ? '<b class="pro">Via calda: sopra la mediana di zona</b>' : '<span>Sotto o in linea con la mediana di zona</span>'}
        <div class="fonte">Fonte: Immobiliare.it, prezzi richiesti per via, settembre 2026. Tracciato: OpenStreetMap${v.m === 'punto' ? ' (via abbinata per vicinanza al punto)' : ''}.</div></div>`, { maxWidth: 320 });
  });
  L.control.layers(null, { 'Macrozone': gruppo, 'Vie (€/mq)': gVie }, { collapsed: false, position: 'topright' }).addTo(map);

  const leg = L.control({ position: 'bottomleft' });
  leg.onAdd = () => {
    const d = L.DomUtil.create('div', 'legenda');
    const sw = SCALA.map(c => `<span style="display:inline-block;width:16px;height:10px;background:${c};opacity:.75"></span>`).join('');
    d.innerHTML = '<b>Mappa valori Lodi</b><br><b>€/mq richiesto per zona</b><br>' + sw +
      '<br><small style="display:flex;justify-content:space-between;width:176px"><span>&lt; 1.800</span><span>&ge; 2.700</span></small>' +
      `<span style="display:inline-block;width:22px;height:0;border-top:6px solid #c8a000;box-shadow:0 0 0 2px #000;vertical-align:middle;margin-right:6px"></span>Via calda (sopra la mediana di zona): ${nCalde} su ${vie.length}<br>` +
      '<small>Colore delle vie = €/mq richiesto, stessa scala</small><br>' +
      '<i style="border-color:#c0392b;border-top-style:dashed"></i>Confine comunale<br>' +
      '<i style="border-color:#1f6fd1"></i>Adda<br>' +
      '<i style="border-color:#333;border-top-style:dotted"></i>Ferrovia<br>' +
      '<span style="color:#e67e22">&#9679;</span> Punti di riferimento<br>' +
      `<small>Confini zona provvisori. Geometrie: OpenStreetMap, ${BASE.data}</small>`;
    return d;
  };
  leg.addTo(map);
});

// --- Base cartografica (sopra le zone) ---
const confine = L.polyline(BASE.confine, { color: '#c0392b', weight: 3, dashArray: '8 5', interactive: false }).addTo(map);
L.polyline(BASE.adda, { color: '#1f6fd1', weight: 5, opacity: .8, interactive: false }).addTo(map);
L.polyline(BASE.ferrovia, { color: '#333', weight: 3, dashArray: '2 6', interactive: false }).addTo(map);
BASE.punti.forEach(p =>
  L.circleMarker(p.c, { radius: 8, color: '#fff', weight: 2, fillColor: '#e67e22', fillOpacity: 1 })
    .addTo(map).bindPopup(`<b>${p.n}</b><br><small>Fonte: OpenStreetMap (${p.osm})</small>`)
);
const adatta = () => { map.invalidateSize(); map.fitBounds(confine.getBounds()); };
adatta();
window.addEventListener('load', adatta);
</script>
</body>
</html>
