<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mappa valori Lodi</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
  #map { height: 100%; }
  .leaflet-interactive:focus { outline: none; }
  .legenda { background: #fff; padding: 8px 10px; border-radius: 6px; font-size: 13px; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .legenda i { display: inline-block; width: 22px; height: 0; border-top: 4px solid; vertical-align: middle; margin-right: 6px; }
  .legenda small { color: #666; }
  .pannello { background: #fff; padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.4; box-shadow: 0 1px 4px rgba(0,0,0,.3);
              width: 320px; max-width: calc(100vw - 40px); max-height: calc(100vh - 130px); overflow: auto; }
  .pannello h3 { margin: 0 0 4px; font-size: 16px; }
  .pannello .kpi { margin: 6px 0; } .pannello .kpi b { font-size: 16px; }
  .pannello ul { margin: 2px 0 6px; padding-left: 18px; }
  .pannello .pro { color: #1a7f37; } .pannello .contro { color: #b3261e; }
  .pannello .fonte { color: #666; font-size: 11px; margin-top: 6px; }
  .pannello button { font: inherit; cursor: pointer; border: 1px solid #bbb; background: #f6f6f6; border-radius: 4px; padding: 3px 8px; margin-bottom: 6px; }
  .pannello details { margin: 6px 0; }
  .micro { display: flex; gap: 6px; align-items: center; padding: 3px 4px; border-radius: 4px; cursor: pointer; }
  .micro:hover { background: #eee; }
  .micro .sw { flex: none; width: 18px; height: 14px; border: 1px solid #666; }
  .micro small { color: #666; margin-left: auto; white-space: nowrap; }
  .pop { font-size: 13px; line-height: 1.4; max-width: 280px; } .pop h4 { margin: 0 0 4px; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data/base.js"></script>
<script>
const map = L.map('map').setView([45.314, 9.503], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Scala di Immobiliare.it (legenda della sua mappa prezzi, 11 classi): < 1.800, poi classi da 100 €/mq fino a >= 2.700
const SCALA = ['rgb(32,157,76)', 'rgb(67,161,63)', 'rgb(107,166,47)', 'rgb(148,172,31)', 'rgb(187,177,16)', 'rgb(228,181,0)',
               'rgb(221,152,12)', 'rgb(214,121,25)', 'rgb(207,92,36)', 'rgb(200,61,49)', 'rgb(194,33,60)'];
const classe = v => v < 1800 ? 0 : v >= 2700 ? 10 : Math.floor((v - 1800) / 100) + 1;
const colore = v => SCALA[classe(v)];
const fasciaDi = p => `${eur(p.lo)}–${eur(p.hi)}`;
const eur = n => Math.round(n).toLocaleString('it-IT');
const dec = n => String(n).replace('.', ',');
const lista = a => '<ul>' + a.map(x => `<li>${x}</li>`).join('') + '</ul>';

// --- Base cartografica (sotto, non intercetta i clic) ---
const confine = L.polyline(BASE.confine, { color: '#c0392b', weight: 3, dashArray: '8 5', interactive: false });
const base = L.layerGroup([
  confine,
  L.polyline(BASE.adda, { color: '#1f6fd1', weight: 5, opacity: .8, interactive: false }),
  L.polyline(BASE.ferrovia, { color: '#333', weight: 3, dashArray: '2 6', interactive: false }),
]).addTo(map);
BASE.punti.forEach(p =>
  L.circleMarker(p.c, { radius: 8, color: '#fff', weight: 2, fillColor: '#e67e22', fillOpacity: 1 })
    .addTo(map).bindPopup(`<b>${p.n}</b><br><small>Fonte: OpenStreetMap (${p.osm})</small>`)
);
const adatta = () => { map.invalidateSize(); if (!scelta) map.fitBounds(confine.getBounds()); };
let scelta = null;
adatta();
window.addEventListener('load', adatta);

Promise.all(['data/zone.json', 'data/zone-poly.json', 'data/micro.json', 'data/vie.json'].map(u => fetch(u).then(r => r.json()))).then(([zone, poligoni, micro, vie]) => {
  const livZone = L.layerGroup().addTo(map), livMicro = L.layerGroup().addTo(map), livVie = L.layerGroup().addTo(map);
  const layerZona = {}, byK = Object.fromEntries(zone.map(z => [z.k, z]));
  const stileZona = (k, mode) => ({ color: mode === 'sel' ? '#111' : mode === 'spenta' ? '#999' : '#fff',
    weight: mode === 'sel' ? 3 : mode === 'spenta' ? 1 : 2, fillColor: colore(byK[k].ask), fillOpacity: mode === 'sel' ? 0 : mode === 'spenta' ? .08 : .6 });

  // --- Pannello informativo ---
  const pannello = L.control({ position: 'topright' });
  pannello.onAdd = () => { const d = L.DomUtil.create('div', 'pannello'); L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d); pannello._d = d; return d; };
  pannello.addTo(map);
  const intro = () => {
    pannello._d.innerHTML = '<h3>Zone di Lodi</h3><div>Clicca una zona per isolarla e vedere le microzone per fascia di prezzo.</div>' +
      '<div class="fonte">Prezzi richiesti, Immobiliare.it, settembre 2026. Le microzone sono stime: vedi il dettaglio nel pannello della zona.</div>';
  };

  function seleziona(k) {
    scelta = k; const z = byK[k];
    for (const kk in layerZona) layerZona[kk].setStyle(stileZona(kk, kk === k ? 'sel' : 'spenta'));
    livMicro.clearLayers(); livVie.clearLayers();
    const ms = micro.features.filter(f => f.properties.z === k).sort((a, b) => b.properties.pm - a.properties.pm);
    const lm = ms.map(f => {
      const p = f.properties;
      const l = L.geoJSON(f, { style: { color: '#fff', weight: 2, fillColor: colore(p.pm), fillOpacity: .6 } }).addTo(livMicro)
        .bindTooltip(`Microzona ${fasciaDi(p)} €/mq (stima ${eur(p.pm)})`, { sticky: true })
        .bindPopup(`<div class="pop"><h4>Microzona ${fasciaDi(p)} €/mq</h4>
          Prezzo stimato medio: <b>${eur(p.pm)} €/mq</b><br>Superficie: ${dec(p.km2)} km²<br>
          Dato diretto da vie vicine: ${p.dir}% della superficie, il resto è stimato dagli isolati vicini o dalla media di zona.
          ${p.vie.length ? '<br>Vie di riferimento: ' + p.vie.map(v => `${v[0]} (${eur(v[1])})`).join(', ') : '<br>Nessuna via elencata: stima.'}</div>`, { maxWidth: 300 });
      return [f, l];
    });
    const dx = innerWidth > 700 ? 370 : 30; // il pannello copre la destra della mappa
    map.flyToBounds(layerZona[k].getBounds(), { paddingTopLeft: [30, 30], paddingBottomRight: [dx, 30], duration: .8 });

    pannello._d.innerHTML = `<button id="indietro">← Tutta Lodi</button><h3>${k}</h3>
      <div>${z.pos}</div>
      <div class="kpi"><b>${eur(z.ask)} €/mq</b> richiesto · trend 12 mesi <b>${z.yoy > 0 ? '+' : ''}${dec(z.yoy)}%</b><br>
        ${z.n} annunci · affitto ${dec(z.rent)} €/mq/mese · giudizio flipping: <b>${z.score}</b></div>
      <b>Microzone (stima per fascia di prezzo)</b>
      <div id="elencoMicro">${ms.map((f, i) => f.properties.km2 < .005 ? '' : `<div class="micro" data-i="${i}"><span class="sw" style="background:${colore(f.properties.pm)}"></span>
        ${fasciaDi(f.properties)} €/mq<small>stima ${eur(f.properties.pm)} · ${dec(f.properties.km2)} km²</small></div>`).join('')}</div>
      <details><summary>Pro, contro e giudizio</summary>
        <b class="pro">Pro</b>${lista(z.pro)}<b class="contro">Contro</b>${lista(z.contro)}
        <div>${z.flip}</div><div style="margin-top:4px"><b>Microzone secondo il mercato:</b> ${z.micro}</div></details>
      <div class="fonte">Prezzi: Immobiliare.it, richiesti (non compravendite), settembre 2026. Microzone: stima dai prezzi delle vie elencate, estesa agli isolati vicini della stessa zona; confini zona provvisori.</div>`;
    document.getElementById('indietro').onclick = esci;
    document.querySelectorAll('#elencoMicro .micro').forEach(el => el.onclick = () => {
      const [f, l] = lm[+el.dataset.i]; map.flyToBounds(l.getBounds(), { padding: [40, 40], maxZoom: 17, duration: .6 }); l.openPopup(l.getBounds().getCenter());
    });
  }
  function esci() {
    scelta = null; livMicro.clearLayers(); livVie.clearLayers();
    for (const kk in layerZona) layerZona[kk].setStyle(stileZona(kk, 'norm'));
    intro(); map.flyToBounds(confine.getBounds(), { duration: .8 });
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && scelta) esci(); });

  // --- Macrozone ---
  zone.forEach(z => {
    const pezzi = poligoni.features.filter(f => f.properties.k === z.k);
    if (!pezzi.length) return;
    layerZona[z.k] = L.geoJSON({ type: 'FeatureCollection', features: pezzi }, { style: stileZona(z.k, 'norm') }).addTo(livZone)
      .bindTooltip(`${z.k}: ${eur(z.ask)} €/mq`, { sticky: true })
      .on('click', () => seleziona(z.k));
  });
  intro();

  const leg = L.control({ position: 'bottomleft' });
  leg.onAdd = () => {
    const d = L.DomUtil.create('div', 'legenda');
    const sw = SCALA.map(c => `<span style="display:inline-block;width:16px;height:10px;background:${c};opacity:.8"></span>`).join('');
    d.innerHTML = '<b>Mappa valori Lodi</b><br><b>€/mq richiesto</b><br>' + sw +
      '<br><small style="display:flex;justify-content:space-between;width:176px"><span>&lt; 1.800</span><span>&ge; 2.700</span></small>' +
      '<i style="border-color:#c0392b;border-top-style:dashed"></i>Confine comunale<br>' +
      '<i style="border-color:#1f6fd1"></i>Adda<br>' +
      '<i style="border-color:#333;border-top-style:dotted"></i>Ferrovia<br>' +
      '<span style="color:#e67e22">&#9679;</span> Punti di riferimento<br>' +
      `<small>Confini zona provvisori. Geometrie: OpenStreetMap, ${BASE.data}</small>`;
    return d;
  };
  leg.addTo(map);
});
</script>
</body>
</html>
