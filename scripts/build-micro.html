<!doctype html>
<meta charset="utf-8">
<title>Build microzone</title>
<pre id="log" style="font:13px monospace"></pre>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script>
// Genera data/micro.json: ogni macrozona e' divisa in poche microzone per fascia di prezzo larga (250 €/mq).
// Le microzone seguono gli isolati OSM.
// - un isolato delimitato da vie di data/vie.json prende la media dei loro prezzi richiesti (dato diretto);
// - gli altri prendono la media degli isolati vicini della stessa zona (stima, ripetuta fino a coprire la zona);
// - cio' che resta senza dati prende il prezzo medio di zona (stima);
// - i prezzi sono lisciati con i vicini; le microzone troppo piccole sono assorbite dalla confinante piu' simile
//   (area minima: 4% della zona, tra 0,03 e 0,12 km2), cosi' restano pochi quartieri leggibili.
// Uso: servire il progetto con scripts/serve.ps1 e aprire /scripts/build-micro.html
// (richiede data/zone-poly.json, data/vie.json con tracciati e scripts/cache/strade.raw.json)
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const k5 = (lo, la) => lo.toFixed(5) + ',' + la.toFixed(5);
const FASCIA = 250, BASE0 = 1500;                                   // fasce [1500,1750), [1750,2000), ...
const classe = v => Math.max(0, Math.floor((v - BASE0) / FASCIA));
const valido = c => c.length && c.every(r => r.length >= 4);
const polys = f => !f ? [] : f.geometry.type === 'Polygon' ? (valido(f.geometry.coordinates) ? [f] : []) : f.geometry.coordinates.filter(valido).map(c => turf.polygon(c));
const tagli = (p, q) => { try { return polys(turf.intersect(p, q)); } catch (e) { return []; } };
const meno = (p, q) => { try { return polys(turf.difference(p, q)); } catch (e) { return [p]; } };
const unisci = a => { let u = a[0]; for (let i = 1; i < a.length; i++) { try { u = turf.union(u, a[i]) || u; } catch (e) {} } return u; };

(async () => {
  const raw = await (await fetch('/scripts/cache/strade.raw.json')).json();
  const vie = await (await fetch('/data/vie.json')).json();
  const zonePoly = (await (await fetch('/data/zone-poly.json')).json()).features;
  const zone = await (await fetch('/data/zone.json')).json();
  const ask = Object.fromEntries(zone.map(z => [z.k, z.ask]));

  const linee = turf.featureCollection(raw.elements.filter(e => e.geometry && e.geometry.length > 1)
    .map(e => turf.lineString(e.geometry.map(p => [p.lon, p.lat]))));
  const facce = turf.polygonize(linee).features;
  log('isolati: ' + facce.length);

  // vertici delle vie elencate -> indici di via
  const vv = new Map();
  vie.forEach((v, i) => (v.g || []).forEach(w => w.forEach(([la, lo]) => { const k = k5(lo, la); (vv.get(k) || vv.set(k, new Set()).get(k)).add(i); })));

  const ring = f => [...new Set(f.geometry.coordinates[0].map(c => k5(c[0], c[1])))];
  const rings = facce.map(ring);
  const perVertice = new Map();
  rings.forEach((r, i) => r.forEach(k => (perVertice.get(k) || perVertice.set(k, []).get(k)).push(i)));

  // zona di ogni isolato (dal suo punto interno)
  const punto = facce.map(f => turf.pointOnFeature(f));
  const zonaDi = punto.map(p => { const z = zonePoly.find(f => turf.booleanPointInPolygon(p, f)); return z ? z.properties.k : null; });

  // prezzo diretto: media delle vie elencate che costeggiano l'isolato (almeno 2 vertici in comune = un lato)
  const prezzo = new Array(facce.length).fill(null), tipo = new Array(facce.length).fill(null), viaDi = facce.map(() => []);
  rings.forEach((r, i) => {
    const cnt = {}; r.forEach(k => (vv.get(k) || []).forEach(s => cnt[s] = (cnt[s] || 0) + 1));
    const ss = Object.keys(cnt).filter(s => cnt[s] >= 2).map(Number);
    if (ss.length) { prezzo[i] = ss.reduce((a, s) => a + vie[s].p, 0) / ss.length; tipo[i] = 'diretta'; viaDi[i] = ss; }
  });
  log('isolati con prezzo diretto: ' + tipo.filter(Boolean).length);

  // stima dagli isolati vicini della stessa zona
  for (let giro = 0; giro < 80; giro++) {
    const nuovo = [];
    facce.forEach((f, i) => {
      if (prezzo[i] !== null) return;
      const s = []; rings[i].forEach(k => perVertice.get(k).forEach(j => { if (j !== i && prezzo[j] !== null && zonaDi[j] === zonaDi[i]) s.push(prezzo[j]); }));
      if (s.length) nuovo.push([i, s.reduce((a, b) => a + b, 0) / s.length]);
    });
    if (!nuovo.length) break;
    nuovo.forEach(([i, p]) => { prezzo[i] = p; tipo[i] = 'stima'; });
  }
  log('isolati stimati dai vicini: ' + tipo.filter(t => t === 'stima').length);

  // lisciatura: meta' prezzo proprio, meta' media dei vicini della stessa zona (due passate)
  for (let g = 0; g < 2; g++) {
    const nuovo = prezzo.map((p, i) => {
      if (p === null) return p;
      const s = []; rings[i].forEach(k => perVertice.get(k).forEach(j => { if (j !== i && prezzo[j] !== null && zonaDi[j] === zonaDi[i]) s.push(prezzo[j]); }));
      return s.length ? 0.5 * p + 0.5 * s.reduce((a, b) => a + b, 0) / s.length : p;
    });
    nuovo.forEach((p, i) => prezzo[i] = p);
  }

  // pezzi per zona, raggruppati per classe di prezzo
  const out = [];
  for (const Z of zonePoly) {
    const k = Z.properties.k, bz = turf.bbox(Z), pezzi = [];
    facce.forEach((f, i) => {
      const b = turf.bbox(f);
      if (b[0] > bz[2] || b[2] < bz[0] || b[1] > bz[3] || b[3] < bz[1]) return;
      const dentro = tagli(f, Z);
      dentro.forEach(p => pezzi.push({ f: p, i }));
    });
    const coperto = unisci(pezzi.map(p => p.f));
    const avanzo = meno(Z, coperto).filter(p => turf.area(p) > 500);
    // tutti i pezzi della zona: poligono, prezzo, dato diretto o stima, vie di riferimento
    const tutti = pezzi.map(p => ({ f: p.f, prz: prezzo[p.i] ?? ask[k], dir: tipo[p.i] === 'diretta', vie: viaDi[p.i] }))
      .concat(avanzo.map(p => ({ f: p, prz: ask[k], dir: false, vie: [] })));
    tutti.forEach(t => t.a = turf.area(t.f));
    const chiudi = u => { try { return turf.buffer(turf.buffer(u, 0.003, { units: 'kilometers' }), -0.003, { units: 'kilometers' }); } catch (e) { return u; } };
    // 1) parti contigue per fascia di prezzo
    const gr = {}; tutti.forEach(t => (gr[classe(t.prz)] = gr[classe(t.prz)] || []).push(t.f));
    let parti = [];
    Object.keys(gr).forEach(c => polys(chiudi(unisci(gr[c]))).forEach(p => parti.push({ p, a: turf.area(p) })));
    // 2) le parti troppo piccole passano alla confinante con cui dividono piu' bordo
    const areaZona = turf.area(Z), minA = Math.min(Math.max(30000, 0.04 * areaZona), 120000);
    for (let g = 0; g < 500 && parti.length > 1; g++) {
      parti.sort((a, b) => a.a - b.a);
      const s = parti[0]; if (s.a >= minA) break;
      let sb; try { sb = turf.buffer(s.p, 0.012, { units: 'kilometers' }); } catch (e) { sb = s.p; }
      let best = null, ba = -1;
      parti.slice(1).forEach(q => { const x = tagli(sb, q.p).reduce((a, y) => a + turf.area(y), 0); if (x > ba) { ba = x; best = q; } });
      if (ba <= 0) { // isola senza contatto: la parte piu' vicina
        const c0 = turf.centroid(s.p); let bd = 1e9; parti.slice(1).forEach(q => { const d = turf.distance(c0, turf.centroid(q.p)); if (d < bd) { bd = d; best = q; } });
      }
      best.p = chiudi(unisci(polys(best.p).concat(polys(s.p)))); best.a = turf.area(best.p);
      parti.shift();
    }
    // 3) statistiche per parte (dai pezzi contenuti), nuova fascia dal prezzo medio, unione delle parti della stessa fascia
    const pt = parti.map(q => ({ p: q.p, a: 0, ap: 0, ad: 0, vie: new Set() }));
    tutti.forEach(t => {
      const c = turf.pointOnFeature(t.f); let q = pt.find(x => polys(x.p).some(y => turf.booleanPointInPolygon(c, y)));
      if (!q) { let bd = 1e9; pt.forEach(x => { const d = turf.distance(c, turf.centroid(x.p)); if (d < bd) { bd = d; q = x; } }); }
      q.a += t.a; q.ap += t.a * t.prz; if (t.dir) q.ad += t.a; t.vie.forEach(s => q.vie.add(s));
    });
    const fin = {};
    pt.filter(q => q.a > 0).forEach(q => { const c = classe(q.ap / q.a); (fin[c] = fin[c] || []).push(q); });
    Object.keys(fin).forEach(c => {
      const qs = fin[c], a = qs.reduce((s, q) => s + q.a, 0), ap = qs.reduce((s, q) => s + q.ap, 0), ad = qs.reduce((s, q) => s + q.ad, 0);
      let u = turf.truncate(turf.simplify(chiudi(unisci(qs.flatMap(q => polys(q.p)))), { tolerance: 0.00001, highQuality: false }), { precision: 5 });
      u.properties = { z: k, c: +c, lo: BASE0 + FASCIA * c, hi: BASE0 + FASCIA * (+c + 1), pm: Math.round(ap / a), dir: Math.round(100 * ad / a), km2: +(a / 1e6).toFixed(3), vie: [...new Set(qs.flatMap(q => [...q.vie]))] };
      out.push(u);
    });
    log(`${k}: ${Object.keys(fin).length} microzone (min ${Math.round(minA / 1000) / 1000} km2), ${tutti.length} pezzi`);
  }
  // elenco vie fuori dal file: nel popup servono nome e prezzo
  out.forEach(u => u.properties.vie = u.properties.vie.map(s => [vie[s].n, vie[s].p]));
  const body = JSON.stringify(turf.featureCollection(out));
  const r = await fetch('/__save?f=data/micro.json', { method: 'POST', body });
  log('salvato: ' + r.status + ' (' + Math.round(body.length / 1024) + ' KB), microzone: ' + out.length);
})().catch(e => log('ERRORE ' + e + '\n' + e.stack));
</script>
