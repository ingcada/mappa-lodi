<!doctype html>
<meta charset="utf-8">
<title>Build zone</title>
<pre id="log" style="font:13px monospace"></pre>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script src="../data/base.js"></script>
<script>
// Genera data/zone-poly.json: le macrozone seguono la rete stradale reale (OSM) e la
// suddivisione di mercato di Immobiliare.it, cioe' la zona di ciascuna via in data/vie.json.
// 1) le strade formano gli isolati (poligonize);
// 2) un isolato prende la zona delle vie elencate che lo delimitano (voto sui suoi vertici);
// 3) gli isolati senza vie elencate prendono la zona dei vicini (propagazione), poi della via piu' vicina;
// 4) le aree del comune fuori dagli isolati prendono la zona della via elencata piu' vicina.
// Uso: servire il progetto con scripts/serve.ps1 e aprire /scripts/build-zone.html
const log = m => { document.getElementById('log').textContent += m + '\n'; console.log(m); };
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
const key = c => c[0] + ',' + c[1];
const polys = f => !f ? [] : f.geometry.type === 'Polygon' ? [f] : f.geometry.coordinates.map(c => turf.polygon(c));

function anelli(ways) {
  const same = (a, b) => a[0] === b[0] && a[1] === b[1];
  const rest = ways.map(w => w.slice()), out = [];
  while (rest.length) {
    let r = rest.shift(), found = true;
    while (found && !same(r[0], r[r.length - 1])) {
      found = false;
      for (let i = 0; i < rest.length; i++) {
        const w = rest[i], last = r[r.length - 1];
        if (same(last, w[0])) r = r.concat(w.slice(1));
        else if (same(last, w[w.length - 1])) r = r.concat(w.slice().reverse().slice(1));
        else if (same(r[0], w[w.length - 1])) r = w.slice(0, -1).concat(r);
        else if (same(r[0], w[0])) r = w.slice().reverse().slice(0, -1).concat(r);
        else continue;
        rest.splice(i, 1); found = true; break;
      }
    }
    if (!same(r[0], r[r.length - 1])) r.push(r[0]);
    out.push([r.map(([la, lo]) => [lo, la])]);
  }
  return out;
}

(async () => {
  const raw = await (await fetch('/scripts/cache/strade.raw.json')).json();
  const vie = await (await fetch('/data/vie.json')).json();
  const ways = raw.elements.filter(e => e.geometry && e.geometry.length > 1)
    .map(e => ({ nome: norm(e.tags.name || ''), c: e.geometry.map(p => [p.lon, p.lat]) }));
  const linee = turf.featureCollection(ways.map(w => turf.lineString(w.c)));
  const comune = turf.multiPolygon(anelli(BASE.confine));

  // --- vie elencate -> way OSM (per nome; altrimenti il way piu' vicino al punto, entro 80 m)
  const semi = []; // {zona, c}
  let perNome = 0, perPunto = 0, perso = 0;
  vie.forEach(v => {
    let sel = ways.filter(w => w.nome && w.nome === norm(v.n));
    if (sel.length) perNome++;
    else {
      const p = turf.point([v.lon, v.lat]); let best = null, bd = 0.08;
      ways.forEach(w => { const d = turf.pointToLineDistance(p, turf.lineString(w.c), { units: 'kilometers' }); if (d < bd) { bd = d; best = w; } });
      if (best) { sel = [best]; perPunto++; } else perso++;
    }
    sel.forEach(w => semi.push({ zona: v.z, c: w.c }));
  });
  log(`vie: ${vie.length} (per nome ${perNome}, per punto ${perPunto}, non trovate ${perso}); tratti di via: ${semi.length}`);
  const semiLinee = semi.map(s => ({ zona: s.zona, f: turf.lineString(s.c) }));
  const piuVicina = (pt, escl) => { let bz = null, bd = 1e9; semiLinee.forEach(s => { if (escl && escl.has(s.zona)) return; const d = turf.pointToLineDistance(pt, s.f); if (d < bd) { bd = d; bz = s.zona; } }); return bz; };

  // --- schermata di Immobiliare.it (data/zone-ref.json): dentro la sua area le zone ricalcate comandano
  const rif = await (await fetch('/data/zone-ref.json')).json();
  const ext = rif.features.find(f => f.properties.k === '__extent');
  const refs = rif.features.filter(f => f.properties.k !== '__extent');
  const REFZ = new Set(refs.map(f => f.properties.k));
  const inExt = pt => turf.booleanPointInPolygon(pt, ext);
  const refDi = pt => { const f = refs.find(r => turf.booleanPointInPolygon(pt, r)); return f ? f.properties.k : null; };

  // --- voti: ogni vertice di via elencata porta la sua zona
  const vv = new Map();
  semi.forEach(s => s.c.forEach(c => { const k = key(c), m = vv.get(k) || {}; m[s.zona] = (m[s.zona] || 0) + 1; vv.set(k, m); }));

  const facce = turf.polygonize(linee).features;
  log('isolati: ' + facce.length);
  const anelloK = f => f.geometry.coordinates[0].map(key);
  const zona = new Array(facce.length).fill(null);
  const perVertice = new Map();
  facce.forEach((f, i) => anelloK(f).forEach(k => { (perVertice.get(k) || perVertice.set(k, []).get(k)).push(i); }));
  // isolati dentro l'area della schermata: zona ricalcata, oppure "altra zona" (mai una delle 4 ricalcate)
  const punto = facce.map(f => turf.pointOnFeature(f));
  const nellaSchermata = punto.map(p => inExt(p));
  const escl = i => nellaSchermata[i] ? REFZ : null;
  let daRif = 0; const daSchermata = new Array(facce.length).fill(false); // le zone ricalcate non si estendono fuori dalla schermata
  // isolati grandi (> 0,15 km2): il contorno ricalcato li taglia, invece di assegnarli per intero
  const grande = facce.map((f, i) => nellaSchermata[i] && turf.area(f) > 150000);
  facce.forEach((f, i) => { if (nellaSchermata[i] && !grande[i]) { const z = refDi(punto[i]); if (z) { zona[i] = z; daSchermata[i] = true; daRif++; } } });
  log(`isolati nella schermata: ${nellaSchermata.filter(Boolean).length} (di cui in una zona ricalcata: ${daRif})`);
  const sceglie = (t, i) => { const e = escl(i); return Object.keys(t).filter(z => !(e && e.has(z))).sort((a, b) => t[b] - t[a])[0]; };
  facce.forEach((f, i) => {
    if (zona[i]) return;
    const t = {}; anelloK(f).forEach(k => { const m = vv.get(k); if (m) for (const z in m) t[z] = (t[z] || 0) + m[z]; });
    const z = sceglie(t, i); if (z) zona[i] = z;
  });
  log('isolati con via elencata: ' + zona.filter(Boolean).length);

  // --- propagazione dai vicini
  for (let giro = 0; giro < 60; giro++) {
    const nuovo = [];
    facce.forEach((f, i) => {
      if (zona[i]) return;
      const t = {}; anelloK(f).forEach(k => perVertice.get(k).forEach(j => { if (j !== i && zona[j] && !daSchermata[j]) t[zona[j]] = (t[zona[j]] || 0) + 1; }));
      const z = sceglie(t, i); if (z) nuovo.push([i, z]);
    });
    if (!nuovo.length) break;
    nuovo.forEach(([i, z]) => zona[i] = z);
  }
  let resto = 0;
  facce.forEach((f, i) => { if (!zona[i]) { zona[i] = piuVicina(punto[i], escl(i)); resto++; } });
  log('isolati assegnati per vicinanza: ' + resto);

  const acc = {}; const add = (k, f) => { if (f && k) (acc[k] = acc[k] || []).push(f); };
  const tagli = (p, q) => { try { return polys(turf.intersect(p, q)); } catch (e) { return []; } };
  const meno = (p, q) => { try { return polys(turf.difference(p, q)); } catch (e) { return [p]; } };
  const dentro = [];
  facce.forEach((f, i) => {
    let x; try { x = turf.intersect(f, comune); } catch (e) { return; }
    polys(x).forEach(p => {
      dentro.push(p);
      if (!grande[i]) return add(zona[i], p);
      let resto = [p];
      refs.forEach(r => { tagli(p, r).forEach(q => add(r.properties.k, q)); resto = resto.flatMap(y => meno(y, r)); });
      resto.forEach(y => add(zona[i], y));
    });
  });
  let coperto = dentro[0];
  for (let i = 1; i < dentro.length; i++) { try { coperto = turf.union(coperto, dentro[i]) || coperto; } catch (e) {} }
  // fuori dagli isolati: diagramma di Voronoi dei punti delle vie elencate (una zona per cella)
  const punti = [], visti = new Set();
  semi.forEach(s => s.c.forEach(c => { const k = c[0].toFixed(3) + ',' + c[1].toFixed(3); if (!visti.has(k)) { visti.add(k); punti.push(turf.point(c, { z: s.zona })); } }));
  const vor = turf.voronoi(turf.featureCollection(punti), { bbox: [9.3, 45.2, 9.7, 45.4] });
  const celle = {};
  vor.features.forEach((cella, i) => { if (cella) (celle[punti[i].properties.z] = celle[punti[i].properties.z] || []).push(cella); });
  const regione = z => { let reg = celle[z][0]; for (let i = 1; i < celle[z].length; i++) { try { reg = turf.union(reg, celle[z][i]) || reg; } catch (e) {} } return reg; };
  const regioni = {}; for (const z in celle) regioni[z] = regione(z);
  const avanzo = polys(turf.difference(comune, coperto));
  const avanzoFuori = [];
  avanzo.forEach(p => {
    // dentro la schermata: zone ricalcate; il resto non puo' essere una di esse
    let resta = [p];
    refs.forEach(r => { tagli(p, r).forEach(q => add(r.properties.k, q)); });
    tagli(p, ext).forEach(inn => {
      let rr = [inn]; refs.forEach(r => { rr = rr.flatMap(x => meno(x, r)); });
      rr.forEach(x => { for (const z in regioni) if (!REFZ.has(z)) tagli(x, regioni[z]).forEach(q => add(z, q)); });
    });
    meno(p, ext).forEach(x => avanzoFuori.push(x));
  });
  avanzoFuori.forEach(p => { for (const z in regioni) tagli(p, regioni[z]).forEach(q => add(z, q)); });

  const features = [];
  for (const k of Object.keys(acc)) {
    let u = acc[k][0];
    for (let i = 1; i < acc[k].length; i++) { try { u = turf.union(u, acc[k][i]) || u; } catch (e) {} }
    u = turf.truncate(turf.simplify(u, { tolerance: 0.00001, highQuality: false }), { precision: 5 });
    u.properties = { k };
    features.push(u);
    log(k + ': ' + acc[k].length + ' pezzi, ' + Math.round(turf.area(u) / 1e4) / 100 + ' km2');
  }
  const body = JSON.stringify(turf.featureCollection(features));
  const r = await fetch('/__save?f=data/zone-poly.json', { method: 'POST', body });
  log('salvato: ' + r.status + ' (' + Math.round(body.length / 1024) + ' KB)');
})().catch(e => log('ERRORE ' + e + '\n' + e.stack));
</script>
