<!doctype html>
<meta charset="utf-8">
<title>Build zone</title>
<pre id="log" style="font:13px monospace"></pre>
<script src="https://unpkg.com/@turf/turf@6.5.0/turf.min.js"></script>
<script src="../data/base.js"></script>
<script>
// Genera data/zone-poly.json: le macrozone seguono la rete stradale reale (OSM).
// 1) le strade formano gli isolati (poligonize); 2) ogni isolato prende la zona
// secondo le regole di assegnazione del brief applicate al suo punto interno;
// 3) isolati molto grandi e aree fuori dagli isolati sono tagliati con le soglie del brief.
// Uso: servire il progetto con scripts/serve.ps1 e aprire /scripts/build-zone.html
const log = m => { document.getElementById('log').textContent += m + '\n'; console.log(m); };
const AREA_MAX = 5000000; // m2: sopra questa soglia l'isolato non e' assegnato per intero

function zoneAt(la, lo) {
  if (lo > 9.5079) return la > 45.3205 ? 'Revellino, Campo Marte' : la > 45.305 ? 'Città Bassa, Laghi' : 'San Bernardo, Olmo';
  if (la > 45.3195) return 'Torretta, Martinetta, San Grato';
  if (la > 45.3172 && lo > 9.4995) return 'Città Bassa, Laghi';
  if (la >= 45.3095 && la <= 45.3195 && lo >= 9.4995) return 'Centro Storico';
  if (la < 45.3053 && lo >= 9.5) return 'San Bernardo, Olmo';
  if (la >= 45.305 && la <= 45.3095 && lo >= 9.4995) return 'Braila, Stazione';
  if (la < 45.3095) return 'San Fereolo, Albarola, Faustina';
  return 'Fanfani';
}
// Stesse regole come rettangoli in ordine di priorita' [zona, latMin, latMax, lonMin, lonMax]
const B = { a: 45.2, b: 45.4, c: 9.35, d: 9.65 };
const REG = [
  ['Revellino, Campo Marte', 45.3205, B.b, 9.5079, B.d],
  ['Città Bassa, Laghi', 45.305, 45.3205, 9.5079, B.d],
  ['San Bernardo, Olmo', B.a, 45.305, 9.5079, B.d],
  ['Torretta, Martinetta, San Grato', 45.3195, B.b, B.c, 9.5079],
  ['Città Bassa, Laghi', 45.3172, 45.3195, 9.4995, 9.5079],
  ['Centro Storico', 45.3095, 45.3195, 9.4995, 9.5079],
  ['San Bernardo, Olmo', B.a, 45.3053, 9.5, 9.5079],
  ['Braila, Stazione', 45.305, 45.3095, 9.4995, 9.5079],
  ['San Fereolo, Albarola, Faustina', B.a, 45.3095, B.c, 9.5079],
  ['Fanfani', B.a, B.b, B.c, 9.5079],
];
const rect = (a, b, c, d) => turf.bboxPolygon([c, a, d, b]);
const acc = {}; // zona -> feature[]
const add = (k, f) => { if (f) (acc[k] = acc[k] || []).push(f); };
const polys = f => !f ? [] : f.geometry.type === 'Polygon' ? [f] : f.geometry.coordinates.map(c => turf.polygon(c));

function spezza(f) {
  let rest = f;
  for (const [k, a, b, c, d] of REG) {
    if (!rest) break;
    const r = rect(a, b, c, d);
    const part = turf.intersect(rest, r);
    if (part && turf.area(part) > 1) polys(part).forEach(p => add(k, p));
    rest = turf.difference(rest, r);
  }
}
function assegna(f) {
  if (turf.area(f) > AREA_MAX) return spezza(f);
  const [lo, la] = turf.pointOnFeature(f).geometry.coordinates;
  add(zoneAt(la, lo), f);
}

(async () => {
  const raw = await (await fetch('/scripts/cache/strade.raw.json')).json();
  const linee = turf.featureCollection(raw.elements.filter(e => e.geometry && e.geometry.length > 1)
    .map(e => turf.lineString(e.geometry.map(p => [p.lon, p.lat]))));
  log('strade: ' + linee.features.length);
  const comune = turf.multiPolygon(BASE.confine.length ? (() => {
    // anelli dal confine OSM (stesso unione del sito)
    const same = (a, b) => a[0] === b[0] && a[1] === b[1];
    const rest = BASE.confine.map(w => w.slice()), out = [];
    while (rest.length) {
      let r = rest.shift(), found = true;
      while (found && !same(r[0], r[r.length - 1])) {
        found = false;
        for (let i = 0; i < rest.length; i++) {
          const w = rest[i], last = r[r.length - 1];
          if (same(last, w[0])) r = r.concat(w.slice(1));
          else if (same(last, w[w.length - 1])) r = r.concat(w.slice().reverse().slice(1));
          else if (same(r[0], w[w.length - 1])) r = w.slice(0, -1).concat(r);
          else if (same(r[0], w[0])) r = w.slice().reverse().slice(0, -1).concat(r);
          else continue;
          rest.splice(i, 1); found = true; break;
        }
      }
      if (!same(r[0], r[r.length - 1])) r.push(r[0]);
      out.push([r.map(([la, lo]) => [lo, la])]);
    }
    return out;
  })() : []);

  const facce = turf.polygonize(linee);
  log('isolati: ' + facce.features.length);
  const dentro = [];
  facce.features.forEach(f => {
    let x; try { x = turf.intersect(f, comune); } catch (e) { return; }
    polys(x).forEach(p => { dentro.push(p); assegna(p); });
  });
  log('isolati nel comune: ' + dentro.length);

  // aree del comune non coperte da isolati
  let coperto = dentro[0];
  for (let i = 1; i < dentro.length; i++) { try { coperto = turf.union(coperto, dentro[i]) || coperto; } catch (e) {} }
  const resto = turf.difference(comune, coperto);
  polys(resto).forEach(p => spezza(p));

  const features = [];
  for (const k of Object.keys(acc)) {
    let u = acc[k][0];
    for (let i = 1; i < acc[k].length; i++) { try { u = turf.union(u, acc[k][i]) || u; } catch (e) {} }
    u = turf.truncate(turf.simplify(u, { tolerance: 0.00001, highQuality: false }), { precision: 5 });
    u.properties = { k };
    features.push(u);
    log(k + ': ' + acc[k].length + ' pezzi, ' + Math.round(turf.area(u) / 1e4) / 100 + ' km2');
  }
  const out = turf.featureCollection(features);
  const body = JSON.stringify(out);
  const r = await fetch('/__save?f=data/zone-poly.json', { method: 'POST', body });
  log('salvato: ' + r.status + ' (' + Math.round(body.length / 1024) + ' KB)');
})().catch(e => log('ERRORE ' + e + '\n' + e.stack));
</script>
